<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'">
<title>claude-mnemo · memory console v2</title>
<script>
// Runs BEFORE the stylesheet paints anything: reads the saved choice, falls
// back to the OS, and puts the answer on <html> as `data-theme`. Doing this in
// <head> rather than with the rest of the script is what stops a dark-mode
// reader getting a white flash on every load.
//
// Every colour below is a CSS custom property, so the attribute IS the switch —
// no element is re-rendered, no state is recomputed, and a graph the reader has
// already focused keeps its focus across a toggle.
(function () {
  var saved = null;
  try { saved = localStorage.getItem("mnemo-theme"); } catch (e) { /* private mode */ }
  var dark = saved === "dark" || (saved === null &&
    window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
})();
</script>
<style>
  :root {
    --evidence:#3f8fd2; --decision:#e0a63a; --delivery:#59a86c; --none:#c3c9cf;
    --t-research:#2b6fb5; --t-measure:#6db1e4;
    --t-design:#d98f14; --t-discuss:#edc45c; --t-correction:#b25c1f;
    --t-implement:#2f9e60; --t-fix:#157347; --t-refactor:#69bd8a;
    --t-delegate:#3fa08f; --t-review:#7cb356; --t-ops:#9ab141;
    --override:#d64541; --narrows:#d98e04; --extends:#3b82c4; --indexes:#8e5bb5;
    --grounds:#2e9e6b; --consume:#9c7a5c; --verifies:#16a3a3;
    /* [S15069/T1760, revised by console-focus-encoding ticket 01] GREY'S
       RESERVATION IS RELEASED. It used to say ONE thing only — this edge has
       no lane attribution yet, so nothing else may claim it — and `consume`
       moved off grey to protect that. The exclusivity cost nothing to keep
       because the tenant never moved in: an unattributed edge does not
       render in the graph at all, so `--draft` below has never actually
       painted a pixel. Focus dimming claims grey now instead (`--edge-gray`,
       `path.edge.gray` below) — colour and width both carry focus, not
       opacity alone. Consequence: grey is spoken for again, by a different
       claimant — once draft edges start rendering, an unattributed edge and
       a merely-unfocused one will both read grey, indistinguishable by
       colour alone. `consume` still carries the muted taupe this ruling gave
       it, and `refutes` is still gone with the word itself, folded into
       `override` in v12. */
    --draft:#b9bec4;
    --ink:#2a2e33; --faint:#8a9199; --line:#e4e7ea; --bg:#fbfbfa; --panel:#ffffff;
    --lane:#6b4d8f; --lane-bg:#f3eefa;
    /* Tokens the rules below used to hardcode. Named for their ROLE, not their
       colour, so the dark block can answer each one without a second sweep. */
    --row-hover:#f5f6f7; --row-active:#f7f5fa; --chip-bg:#eef0f2; --chip-ink:#555;
    --chip-ph-ink:#fff; --prompt-bg:#f7f7f6; --edge-gray:#c9cdd1;
    --rowlbl:#6b727a; --rowtitle:#585f66; --rowtitle-none:#b3bac0;
    --lane-dash:#c9b8dd; --tip-bg:#26292d; --tip-ink:#f4f4f2; --tip-faint:#aab3bb;
    --tip-lane:#cdb8e8; --badge-hover:#3a3e43; --accent:#555;
    --sel-ring:#1a1d20;
  }

  /* NIGHT. One override block, no duplication of the light one — the resolver
     in <head> puts `data-theme` on <html> before first paint, so the cascade
     does all the switching and nothing re-renders.

     The neutrals invert; the SEMANTIC hues do NOT simply invert. Every type and
     relation colour above was chosen against white and several (`--t-fix`,
     `--grounds`) are far too dark to read on a dark panel, so each is lifted in
     lightness and slightly desaturated rather than reused. The hue is what
     carries the meaning; the lightness is what has to move. */
  :root[data-theme="dark"] {
    --evidence:#66a8e0; --decision:#e8bb63; --delivery:#7cc48c; --none:#5a626b;
    --t-research:#5c9ee0; --t-measure:#8ec8f0;
    --t-design:#e8a93f; --t-discuss:#f0d07a; --t-correction:#d98244;
    --t-implement:#4fbc80; --t-fix:#3fa06d; --t-refactor:#8ad0a5;
    --t-delegate:#5cc0ad; --t-review:#9bcd76; --t-ops:#b6cc64;
    --override:#e86b67; --narrows:#e8a838; --extends:#63a3e0; --indexes:#ab82cf;
    --grounds:#4dbb88; --consume:#c09a78; --verifies:#3cc0c0;
    --draft:#5a626b;
    --ink:#d7dce1; --faint:#8a939d; --line:#2b3138; --bg:#14171a; --panel:#1b1f24;
    --lane:#b394d6; --lane-bg:#2a2135;
    --row-hover:#20252b; --row-active:#26212f; --chip-bg:#262c33; --chip-ink:#9aa3ad;
    /* The type chip paints its own background from the type colour, and those
       are now LIGHT. White-on-light is the contrast failure this token exists
       to avoid. */
    --chip-ph-ink:#14171a;
    --prompt-bg:#1f242a; --edge-gray:#3d444c;
    --rowlbl:#8a939d; --rowtitle:#aab3bd; --rowtitle-none:#5a626b;
    --lane-dash:#4a3f5c; --tip-bg:#0d0f11; --tip-ink:#e8eaec; --tip-faint:#8a939d;
    --tip-lane:#c4a8e0; --badge-hover:#2f353c; --accent:#8a939d;
    --sel-ring:#f0f2f4;
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { font:14px/1.55 -apple-system,"PingFang SC","Helvetica Neue",sans-serif; color:var(--ink); background:var(--bg); }
  #app { display:flex; height:100vh; }

  aside { width:252px; flex:none; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; padding-bottom:24px; }
  .brand { padding:16px 16px 12px; font-size:15px; font-weight:600; position:relative; }
  /* Sits in the brand block's own whitespace rather than taking a row of its
     own — the sidebar's vertical budget is for content. */
  #themeToggle { position:absolute; top:15px; right:14px; width:24px; height:24px;
    padding:0; border:1px solid var(--line); border-radius:6px; background:transparent;
    color:var(--faint); font-size:12px; line-height:1; cursor:pointer; }
  #themeToggle:hover { border-color:var(--faint); color:var(--ink); }
  .brand span { display:block; font-size:11px; font-weight:400; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; margin-top:1px; }
  .side-sec { font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--faint); padding:14px 16px 5px; }
  .srow { padding:7px 14px 7px 16px; cursor:pointer; border-left:2px solid transparent; }
  .srow:hover { background:var(--row-hover); }
  .srow.active { border-left-color:var(--lane); background:var(--row-active); }
  .srow .rid { font-family:"SF Mono",Menlo,monospace; font-size:11.5px; color:var(--faint); }
  .srow .rt { font-size:12.5px; line-height:1.35; margin:1px 0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .srow .rm { font-size:11px; color:var(--faint); }
  .sdot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; }
  .sdot.open { background:#59a86c; } .sdot.delivered { background:#c3c9cf; }
  .srow .tagline { font-size:10.5px; color:var(--lane); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .srow.more { color:var(--faint); text-align:center; font-size:12px; }
  .srow.more:hover { color:var(--ink); }

  main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  #stoppedBanner, #partialBanner { display:none; flex:none; padding:7px 24px; font-size:12.5px; }
  #stoppedBanner { background:#5c1f1f; color:#fbdede; display:none; align-items:center; gap:12px; }
  #stoppedBanner button { background:#fff; color:#5c1f1f; border:none; border-radius:5px; padding:3px 12px; cursor:pointer; font-size:12px; font-weight:600; }
  #partialBanner { background:#6b4d10; color:#fdecc8; }
  header { padding:14px 24px 8px; flex:none; }
  h1 { font-size:15px; font-weight:600; }
  h1 span { color:var(--faint); font-weight:400; margin-left:10px; font-size:12.5px; }
  #bar { display:flex; flex-wrap:wrap; gap:4px 14px; align-items:center; padding:7px 24px 8px; border-bottom:1px solid var(--line); flex:none; }
  #bar label { display:inline-flex; align-items:center; gap:5px; font-size:12.5px; cursor:pointer; user-select:none; }
  #bar input[type=checkbox]{ accent-color:var(--accent); }
  .sw { width:14px; height:0; border-top:2.5px solid; display:inline-block; border-radius:2px; }
  .sw.dash { border-top-style:dashed; }
  .sep { width:1px; height:16px; background:var(--line); margin:0 2px; }
  #search { margin-left:auto; border:1px solid var(--line); border-radius:6px; padding:4px 9px; font-size:12.5px; width:180px; background:var(--panel); }

  /* console-recall-timeline-panels ticket 13: same box-model as #search
     above, just full-width inside the sidebar's own padding — the two are
     visually one family (jump-in-graph vs. cross-session recall) but never
     confusable, since only one of them lives in the sidebar. */
  .recall-box { padding:4px 16px 12px; }
  .recall-box input { width:100%; border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:12.5px; background:var(--panel); color:var(--ink); }

  /* console-timeline-panel-controls ticket 16: id + view + pageBudget + page
     in one form — the context-adaptive header button (`#timelineBtn`) is a
     PREFILL shortcut into this SAME form, never a second fetch path. */
  .timeline-box { padding:4px 16px 12px; }
  .timeline-box input { width:100%; box-sizing:border-box; border:1px solid var(--line); border-radius:6px; padding:5px 9px; font-size:12.5px; background:var(--panel); color:var(--ink); }
  .timeline-controls { display:flex; gap:6px; margin-top:6px; }
  .timeline-controls select { flex:1 1 auto; min-width:0; border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:12px; background:var(--panel); color:var(--ink); }
  .timeline-controls input[type=number] { width:52px; box-sizing:border-box; border:1px solid var(--line); border-radius:6px; padding:4px 6px; font-size:12px; background:var(--panel); color:var(--ink); }
  .timeline-controls button { border:1px solid var(--line); background:var(--panel); color:var(--faint); border-radius:6px; padding:3px 9px; font-size:12px; cursor:pointer; }
  .timeline-controls button:hover { border-color:var(--lane); color:var(--lane); }

  /* Context-adaptive: one control, its own target decided at click time by
     `timelineIdForContext` (session scope, segment scope, or — when exactly
     one lane is focused — that lane) rather than one trigger per row/chip. */
  #timelineBtn { margin-left:12px; border:1px solid var(--line); background:var(--panel); color:var(--faint); border-radius:6px; padding:2px 10px; font-size:11.5px; cursor:pointer; vertical-align:1px; }
  #timelineBtn:hover { border-color:var(--lane); color:var(--lane); }

  #rangeBar { display:none; align-items:center; gap:9px; padding:5px 24px; border-bottom:1px solid var(--line); flex:none; font-size:12px; color:var(--faint); }
  #rangeBar .rangeLabel { font-family:"SF Mono",Menlo,monospace; color:var(--ink); }
  #rangeBar .rangeNav { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:5px; padding:2px 9px; font-size:11.5px; cursor:pointer; }
  #rangeBar .rangeNav:hover { border-color:var(--lane); color:var(--lane); }
  /* an edge the shell could not place — loud on purpose, never a silent drop */
  #rangeBar .rangeWarn { color:var(--override); font-weight:600; }

  #lanes { padding:8px 24px 4px; flex:none; }
  #lanes .lgroup { display:flex; flex-wrap:wrap; gap:5px 6px; align-items:center; margin-bottom:5px; }
  #lanes .lt { font-size:11px; color:var(--faint); margin-right:4px; min-width:72px; }
  .lchip { font-size:11px; font-family:"SF Mono",Menlo,monospace; padding:2.5px 9px; border-radius:10px; background:var(--lane-bg); color:var(--lane); border:1px solid transparent; cursor:pointer; user-select:none; }
  .lchip:hover { border-color:var(--lane); }
  .lchip.on { background:var(--lane); color:#fff; }
  /* lane-state-retirement ticket 01: the dashed `.openlane` variant is gone
     with the open/closed axis it styled. Every lane chip renders the same,
     because there is no longer a per-lane state to distinguish. */
  .lchip .term { opacity:.75; margin-left:4px; }

  #phases { display:flex; flex-wrap:wrap; gap:4px 12px; padding:4px 24px 6px; font-size:12px; color:var(--faint); flex:none; border-bottom:1px solid var(--line); }
  #phases .clu { display:inline-flex; gap:8px; align-items:center; padding:1px 8px; border:1px solid var(--line); border-radius:9px; }
  #phases .clu b { font-weight:600; color:var(--ink); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:-1px; }

  #wrap { overflow-y:auto; overflow-x:hidden; flex:1; }
  svg text { font-family:"SF Mono",Menlo,monospace; }
  .rowlbl { font-size:11px; fill:var(--rowlbl); font-weight:600; }
  .rowtitle { font-size:11.5px; fill:var(--rowtitle); font-family:-apple-system,"PingFang SC",sans-serif; }
  .rowtitle.none { fill:var(--rowtitle-none); }
  rect.rowhit { fill:transparent; cursor:pointer; }
  rect.rowhit:hover { fill:var(--row-hover); }
  path.edge { fill:none; cursor:pointer; }
  /* console-focus-encoding ticket 01 (cf32918) took weight off `indexes` as
     a channel of its own — it used to render thin, alone, for fanning out
     to the batch it cites, so it reads by its own hue (--indexes) instead
     of a thinner line. That part still holds. What that ticket ALSO did —
     give width to the focused SUBGRAPH, so a whole component read thick
     under any focus and the resting graph (no focus at all) was uniformly
     thick — is revised by user ruling 2026-08-28 [S15069/T1859]: width now
     answers ONE question, "does this edge touch the CLICKED node", nothing
     about focus or attribution. The resting default below is therefore
     THIN; path.edge.inc is the only rule that thickens anything, and it is
     driven by `touchesSel` in paintFilters, not by `.gray`/`.hot`. */
  path.edge { stroke-width:1.1; opacity:.78; }
  path.edge.off { opacity:.04; }
  /* The node's own channel: thick iff one of this edge's two ends is the
     clicked/panel node (`sel`), direction irrelevant — in-edges and
     out-edges both qualify. Independent of colour/focus below: an edge can
     be `.inc` while `.gray` (touches the clicked node but sits outside its
     coloured subgraph) or plain default (no focus at all, node still
     clicked — impossible in the current selection model, since clicking
     always sets a focus, but the rule does not depend on that fact). */
  path.edge.inc { stroke-width:2.2; }
  /* Outside the focused subgraph: grey. Width is NOT this rule's concern —
     path.edge.inc above is the only rule that ever thickens a line, so grey
     edges stay at the base thin width like everything else that is not
     incident to the clicked node. `!important`: each edge's own colour is
     set on `style="stroke:..."` inline (so a theme toggle can re-resolve it
     without a redraw — see renderGraphSvg's own comment), and an inline
     style outranks any class rule without it. */
  path.edge.gray:not(.hot) { stroke:var(--edge-gray) !important; }
  /* hot = inside the focused subgraph: opacity brightens slightly; colour
     needs no rule here because it already carries the emphasis — see
     path.edge.gray above for the outside half of the same decision. Width
     is not part of this rule either: `.hot` and `.inc` are independent
     classes an edge may carry in any combination. */
  path.edge.hot { opacity:.95; }
  g.node { cursor:pointer; }
  g.node.dim, text.dim, rect.dim { opacity:.3; }
  /* The clicked node wears a ring. With the resting graph uniformly thin
     (node-incidence width, [S15069/T1859]), thick edges radiate FROM the
     selected node but nothing marked the node itself — the ring is that
     mark, toggled in paintFilters on `id===sel` and cleared with sel by
     clearFocus. The ring is its OWN circle.selring element rather than a
     stroke on the node body: a multi-type node's body is pie-slice paths,
     not a circle, so a body-stroke rule rings only single-type nodes
     ([S15069/T1863]). --sel-ring is near-ink per theme so it reads against
     every type fill. */
  g.node circle.selring { fill:none; stroke:var(--sel-ring); stroke-width:2; display:none; }
  g.node.sel circle.selring { display:inline; }

  #tip { position:fixed; pointer-events:none; background:var(--tip-bg); color:var(--tip-ink); padding:6px 10px; border-radius:6px; font-size:12px; max-width:420px; display:none; z-index:20; line-height:1.45; }
  #tip .t { color:var(--tip-faint); font-size:11px; }
  #tip .lg { color:var(--tip-lane); }
  #panel { position:fixed; right:0; top:0; bottom:0; width:400px; background:var(--panel); border-left:1px solid var(--line); padding:20px 22px; overflow-y:auto; display:none; z-index:10; box-shadow:-6px 0 18px rgba(0,0,0,.04); }
  #panel .addr { font-family:Menlo,monospace; font-size:12px; color:var(--faint); }
  #panel h2 { font-size:14.5px; font-weight:600; margin:6px 0 10px; }
  #panel .chips { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  .chip { font-size:11px; padding:2px 8px; border-radius:9px; background:var(--chip-bg); color:var(--chip-ink); }
  .chip.ph { color:var(--chip-ph-ink); }
  .chip.lane { background:var(--lane-bg); color:var(--lane); font-family:"SF Mono",Menlo,monospace; }
  /* A stored tag the model does NOT recognise as one of this turn's lanes —
     the segment's own tag, or a word left over from a retired vocabulary.
     Shown, because it is what the turn actually carries; muted and outlined,
     because it names no lane. */
  .chip.tagoff { background:transparent; color:var(--faint); border:1px dashed var(--line); font-family:"SF Mono",Menlo,monospace; }
  #panel .sec { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:14px 0 5px; }
  #panel .content { font-size:13px; white-space:pre-wrap; }
  /* console-recall-timeline-panels ticket 13: recall/timeline render as
     plain server prose, same monospace family the shell already uses for
     every address (.rid, #panel .addr, svg text) — `.content` alone stays
     the turn-detail proportional font, unchanged. */
  #panel .content.mono { font-family:"SF Mono",Menlo,monospace; font-size:12px; }
  #panel .content.mono a.addrlink { color:var(--lane); text-decoration:none; }
  #panel .content.mono a.addrlink:hover { text-decoration:underline; }
  #panel .prompt { font-size:12.5px; color:var(--chip-ink); white-space:pre-wrap; background:#f7f7f6; border-radius:6px; padding:8px 10px; }
  #panel .erow { font-size:12.5px; font-family:Menlo,monospace; padding:2px 0; cursor:pointer; }
  #panel .erow:hover { text-decoration:underline; }
  #panel .erow .etags { color:var(--lane); font-size:11px; }
  #panel .flowline { font-size:12.5px; color:var(--faint); }
  #close { position:absolute; top:12px; right:14px; border:none; background:none; font-size:16px; color:var(--faint); cursor:pointer; }
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#26292d; color:#f2f2f0; font-size:12.5px; padding:8px 16px; border-radius:8px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:30; }
  #selbadge { display:none; margin-left:12px; font-size:11.5px; font-family:"SF Mono",Menlo,monospace; background:#26292d; color:#f2f2f0; padding:2.5px 11px; border-radius:10px; cursor:pointer; vertical-align:1px; }
  #selbadge:hover { background:var(--badge-hover); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">claude-mnemo<span>memory console</span><button id="themeToggle" type="button" title="切换日间 / 夜间"></button></div>
    <div class="side-sec">会话</div>
    <div id="sessions"></div>
    <div class="side-sec">任务</div>
    <div id="segments"></div>
    <div class="side-sec">回忆</div>
    <div class="recall-box"><input id="recallInput" placeholder="关键词或地址 ⏎"></div>
    <div class="side-sec">时间线</div>
    <div class="timeline-box">
      <input id="timelineIdInput" placeholder="S&lt;n&gt; / E&lt;n&gt; / E&lt;n&gt;/#&lt;tag&gt; ⏎" title="timelineQuery 接受的任意合法地址">
      <div class="timeline-controls">
        <select id="timelineViewSelect" title="view — 视图">
          <option value="">turns</option>
          <option value="milestones">milestones</option>
        </select>
        <input id="timelinePageBudget" type="number" min="1" max="25000" placeholder="预算" title="pageBudget（1–25000，默认 1000）">
        <input id="timelinePageInput" type="number" min="1" placeholder="页" title="page（默认 1）">
        <button id="timelinePrev" type="button" title="上一页">‹</button>
        <button id="timelineNext" type="button" title="下一页">›</button>
      </div>
    </div>
  </aside>
  <main>
    <div id="stoppedBanner"><span>worker 无响应 — 当前展示的是最后一次成功加载的快照</span><button id="stoppedRetry" type="button">重试</button></div>
    <div id="partialBanner"></div>
    <header><h1><span id="scopeTitle"></span><span id="meta"></span><span id="selbadge"></span><button id="timelineBtn" type="button" title="查看当前会话/任务(或聚焦泳道)的时间线">⏱ 时间线</button></h1></header>
    <div id="rangeBar"></div>
    <div id="bar"></div>
    <div id="lanes"></div>
    <div id="phases">
      <span class="clu"><b>取证</b>
        <span><span class="dot" style="background:var(--t-research)"></span>research</span>
        <span><span class="dot" style="background:var(--t-measure)"></span>measure</span>
      </span>
      <span class="clu"><b>决策</b>
        <span><span class="dot" style="background:var(--t-design)"></span>design</span>
        <span><span class="dot" style="background:var(--t-discuss)"></span>discuss</span>
        <span><span class="dot" style="background:var(--t-correction)"></span>correction</span>
      </span>
      <span class="clu"><b>落地</b>
        <span><span class="dot" style="background:var(--t-implement)"></span>implement</span>
        <span><span class="dot" style="background:var(--t-fix)"></span>fix</span>
        <span><span class="dot" style="background:var(--t-refactor)"></span>refactor</span>
        <span><span class="dot" style="background:var(--t-delegate)"></span>delegate</span>
        <span><span class="dot" style="background:var(--t-review)"></span>review</span>
        <span><span class="dot" style="background:var(--t-ops)"></span>ops</span>
      </span>
    </div>
    <div id="wrap"><svg id="svg"></svg></div>
  </main>
</div>
<div id="tip"></div>
<div id="panel"><button id="close">✕</button><div id="pbody"></div></div>
<div id="toast"></div>
<script>
// `refutes` left with v12 — it folded into `override`. It stayed in this list
// long enough to keep drawing its own filter checkbox for a word no edge can carry.
const WORDS = ["override","narrows","extends","indexes","grounds","consume","verifies"];
const STRUCT = new Set(["narrows","extends","override"]);
// line style encodes the PHASE axis: solid = same-phase, dashed = cross-phase.
// Cross-phase words never carry lane tags (lanes are phase-local), so the
// dash axis and the tag axis can never collide on one edge.
// [S15069/T1754] The dash used to mean CROSS-PHASE, hardcoded to three relation
// words. lane-model-v12 deleted the phase axis outright — "相位" appears zero
// times in the concepts document — and one of those three words (`refutes`)
// no longer exists at all, having folded into `override`. So the mark was
// keyed on a retired axis through a stale word list.
//
// It now says what the model actually distinguishes: SOLID = internal to one
// lane (both sides resolve to the SAME lane), DASHED = everything else — a
// crossing between two lanes, a half-settled edge, or an unattributed one.
// That is the same predicate the focus domain uses, so the two agree by
// construction instead of by coincidence.
const isInternalEdge = (e) =>
  e.tailLaneToken !== null && e.tailLaneToken === e.headLaneToken;
const TYPE_ORDER = ["research","measure","design","discuss","correction","implement","fix","refactor","delegate","review","ops"];
// Segment status is a closed, DB-CHECK-enforced set ("open"/"closed" —
// db/segments.ts SEGMENT_STATUSES); the CSS only ever shipped two dot
// colors (open=green, "delivered"=grey — the prototype's own demo-data
// vocabulary), so "closed" maps onto the existing grey bucket rather than
// inventing a third visual state. Any future status value this map does not
// know about falls back to the same grey bucket instead of leaking an
// unmapped word into a class attribute (DOM rule: type words map through a
// closed-set lookup before touching class/style).
const SEGMENT_STATUS_DOT = { open: "open", closed: "delivered" };
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// Returns a `var()` REFERENCE, not a resolved literal. `getComputedStyle` reads
// the value in force at RENDER time and bakes it into the attribute, so every
// colour painted through it would stay frozen at the theme that happened to be
// active when the graph was drawn. `relationVar` below already had this right;
// this is the same fix applied to the type colours.
const typeColor = t => TYPE_ORDER.includes(t) ? `var(--t-${t})` : "var(--none)";
const sortTypes = ts => [...ts].sort((a,b)=>{const ia=TYPE_ORDER.indexOf(a),ib=TYPE_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
const esc = s => { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; };
// lane-model-v12 ticket 07: an edge carries ONE lane tag PER SIDE
// (`tailTag` = citing end, `headTag` = cited end; "" = unsettled, i.e. nobody
// has attributed that end yet — not a lane named ""). The payload no longer
// ships a merged `tags` set, because a merged set cannot say WHICH END named
// which lane: `{a,b}` read equally as "in both lanes at once".
const edgeSettled = e => e.tailTag!=="" || e.headTag!=="";
// The label a reader sees. Same-lane (the ordinary case) renders exactly the
// `{tag}` the merged set used to render for a one-tag edge; a CROSS-LANE edge
// renders `{tail→head}`, which is the crossing itself.
const edgeLaneLabel = e => {
  if (!edgeSettled(e)) return "";
  // ONE escape site per side, deliberately: both sinks below render through
  // this helper, so this pair of calls IS the DOM-rule boundary for a lane tag
  // on an edge (tests/worker/console-shell.test.ts's field-sink table).
  const tail = esc(e.tailTag), head = esc(e.headTag);
  return e.tailTag===e.headTag ? "{"+tail+"}" : "{"+tail+"→"+head+"}";
};
// Both sides' lane tokens, unsettled sides dropped and the same-lane case
// collapsed to one — what focus/highlight tests set membership against.
const edgeLaneTokens = e => [...new Set([e.tailLaneToken, e.headLaneToken].filter(t => t !== null))];
// Which component this edge lives INSIDE, or null ([S15069/T1696]). Only an
// edge whose two sides settle to the SAME lane is internal to anything — that
// is the connectivity definition itself, so a cross-lane or half-settled edge
// answers null rather than picking a side. The component is read off whichever
// endpoint is loaded (an interval can cut the other one away); both endpoints
// of an internal edge are in the same component by construction, so either
// answers identically.
const edgeComponentId = e => {
  if (e.tailLaneToken === null || e.tailLaneToken !== e.headLaneToken) return null;
  for (const endpoint of [e.citingId, e.citedId]) {
    const t = idx.has(endpoint) ? turns[idx.get(endpoint)] : null;
    const m = t && t.laneMemberships.find(x => x.token === e.tailLaneToken);
    if (m) return m.componentId;
  }
  return null;
};
// relation is a DB-CHECK-enforced closed set (memory_edges.relation), but a
// style-attribute sink is still built from it below (turn-panel edge rows) —
// this is the same closed-set-lookup discipline the DOM rule asks for,
// applied so the sink can never resolve to anything outside WORDS even if a
// future schema value slips past the CHECK constraint in production data.
const relationVar = rel => WORDS.includes(rel) ? `var(--${rel})` : "inherit";
// Reader-facing turn text is always the S<n>/T<m> address (floor-and-render-
// fidelity ticket 03, user ruling S15069/T1482) — internal `turns.id` stays
// a DATA KEY only (idx/edge citingId/citedId/nodeEls/rowEls), never printed.
// The bare `T<id>` fallback below is a marked last resort, same posture as
// the server-side renderer's own `formatTurnRef` (shared/lane-checker-
// render.ts): every call site this shell has now ships a server-supplied
// address for any id that can legitimately fall outside the currently-loaded
// `turns` array. The ONE id that used to (a lane's terminus, read off
// `state.terminusAddress` rather than through `addrOf` — ticket 03, peer
// P2-5/P2-6) left the payload with lane state in ticket 01, so every id
// `addrOf` IS called with (edge endpoints, the focus badge's `sel`/`solo`,
// panel erows) is, by construction, always a member of the currently-loaded
// `turns`. The fallback is therefore asserted UNREACHABLE on any real graph
// response, kept only as defensive dead code for a malformed fixture.
// `t.address` is server-decided ([S15069/T1557] — ticket 10, "one address
// grammar"): ALWAYS `S<session>/T<prompt>`, under every scope including
// segment. A segment appears only as a SCOPE (the header's own `E<n>`,
// `renderHeader` above), never folded into a turn's own address — this
// supersedes T1524/T1532, which each made a segment scope read
// `E<segment>/T<k>` for its own members, and supersedes the T1531 toggle that
// switch existed to reconcile (a segment holding turns it never adopted used
// to render two address forms interleaved in one column; with one form there
// is nothing left to switch between). The shell never assembles the address
// itself — the `S/T` term below is the same defensive fallback as the bare
// `T<id>` one, for a fixture predating the field.
const sessionAddr = t => `S${t.sessionId}/T${t.promptNumber}`;
const addrOf = id => { const t = turns[idx.get(id)]; return t ? (t.address || sessionAddr(t)) : "T"+id; };

/* ---- mutable render state: reset on every graph load ---- */
let turns = [], edges = [], lanes = [];
let idx = new Map();
let laneByToken = new Map();
let turnsByLaneToken = new Map();
let edgeEls = [];
let nodeEls = new Map(), rowEls = new Map();
const laneChips = new Map();
let sessionsList = [], segmentsList = [];
// nextCursor from the most recent /api/console/sessions page (peer finding
// #10) — null once the last page has been loaded, or before the first load.
let sessionsNextCursor = null;
let sessionsLoadingMore = false;
let currentScope = null; // { kind: "session"|"segment", id }
// The exact params object behind the CURRENT graph response (floor-and-
// render-fidelity ticket 04) — kept so the range bar's "较早"/"最新"
// buttons can re-issue the identical request with only `interval`
// overridden, never reconstructing session/segment from `currentScope`
// alone (which drops any `interval` already in effect).
let currentGraphTarget = null;
let lastLoad = null; // retry hook for the worker-stopped banner

// Focus is a set of COMPONENTS, not of lanes ([S15069/T1696] ruling). A
// component is one lane's members joined by edges carrying that lane's tag on
// BOTH sides, so it belongs to exactly one lane by construction and a lane may
// hold several. Focusing a turn that belongs to two lanes lights BOTH lanes'
// components — two entries here, never one merged region.
let selComps = new Set();
let compLaneToken = new Map();   // componentId -> its lane's token
let turnsByComp = new Map();     // componentId -> member turn ids
let compsByLaneToken = new Map();// lane token -> its own component ids
let solo = null;
let sel = null;
const sameFocus = (comps) => selComps.size===comps.length && comps.every(c=>selComps.has(c));
const focusedLaneTokens = () => new Set([...selComps].map(c=>compLaneToken.get(c)).filter(Boolean));
function clearFocus(){ selComps = new Set(); solo = null; sel = null; panel.style.display="none"; }

/* ---- fixed DOM refs ---- */
// The toggle writes `data-theme` and the saved choice; the cascade does the
// rest. Nothing re-renders, so focus, scroll and the open panel all survive it.
const themeToggle = document.getElementById("themeToggle");
function paintThemeToggle(){
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  themeToggle.textContent = dark ? "☾" : "☀";
  themeToggle.setAttribute("aria-label", dark ? "切换到日间" : "切换到夜间");
}
themeToggle.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  // A stored choice is a DECISION, so it outranks the OS from here on. Storage
  // can throw (private mode); the theme still applies, it just stops persisting.
  try { localStorage.setItem("mnemo-theme", next); } catch (e) { /* ignore */ }
  paintThemeToggle();
});
paintThemeToggle();
// Follow the OS only while the reader has expressed no preference of their own.
if (window.matchMedia) {
  const os = window.matchMedia("(prefers-color-scheme: dark)");
  const onOsChange = (e) => {
    let saved = null;
    try { saved = localStorage.getItem("mnemo-theme"); } catch (err) { /* ignore */ }
    if (saved !== null) return;
    document.documentElement.setAttribute("data-theme", e.matches ? "dark" : "light");
    paintThemeToggle();
  };
  if (os.addEventListener) os.addEventListener("change", onOsChange);
}

const sesBox = document.getElementById("sessions");
const segBox = document.getElementById("segments");
const bar = document.getElementById("bar");
const rangeBar = document.getElementById("rangeBar");
const laneBox = document.getElementById("lanes");
const svg = document.getElementById("svg");
const wrap = document.getElementById("wrap");
const panel = document.getElementById("panel"), pbody = document.getElementById("pbody");
const selBadge = document.getElementById("selbadge");
const scopeTitleEl = document.getElementById("scopeTitle");
const metaEl = document.getElementById("meta");
const stoppedBanner = document.getElementById("stoppedBanner");
const partialBanner = document.getElementById("partialBanner");
const tipEl = document.getElementById("tip");

scopeTitleEl.textContent = "加载中…";

/* ---- worker-stopped snapshot state (spec "Worker lifecycle"): no
   heartbeat, no auto-retry loop — a fetch failure keeps the last rendered
   snapshot on screen and offers exactly one manual retry action. ---- */
function showStopped(retryFn){ lastLoad = retryFn; stoppedBanner.style.display = "flex"; }
function hideStopped(){ stoppedBanner.style.display = "none"; }
document.getElementById("stoppedRetry").addEventListener("click", () => { if (lastLoad) lastLoad(); });

let toastTimer = null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.style.opacity = 1; // textContent — DOM rule's own safe path
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.style.opacity=0, 2600);
}

/**
 * Distinguishes "the worker is unreachable" (network failure — the
 * lifecycle banner's own case) from "the worker answered with an
 * application error" (a well-formed 4xx/5xx envelope — retrying the exact
 * same request would just fail again identically, so a transient toast is
 * the honest signal, not a persistent banner claiming the worker is down).
 */
async function fetchJson(url){
  let res;
  try {
    res = await fetch(url);
  } catch (networkError) {
    const err = new Error("network"); err.kind = "network"; throw err;
  }
  if (!res.ok) {
    let body = null;
    try { body = await res.json(); } catch {}
    const err = new Error("http " + res.status);
    err.kind = "http"; err.status = res.status; err.body = body;
    throw err;
  }
  return res.json();
}

/* ---- sidebar: populated from /api/console/sessions + /api/console/segments ---- */
async function loadSidebar(){
  try {
    const [sessionsRes, segmentsRes] = await Promise.all([
      fetchJson("/api/console/sessions"),
      fetchJson("/api/console/segments"),
    ]);
    sessionsList = sessionsRes.sessions;
    sessionsNextCursor = sessionsRes.nextCursor ?? null;
    segmentsList = segmentsRes.segments;
    renderSidebar();
    hideStopped();
  } catch (e) {
    if (e.kind === "http") {
      toast("加载会话/任务列表失败: " + (e.body && e.body.error && e.body.error.message ? e.body.error.message : ("HTTP " + e.status)));
    } else {
      showStopped(loadSidebar);
    }
  }
}

/* ---- sessions load-more: page max is SESSIONS_PAGE_MAX server-side (peer
   finding #10) — older sessions are unreachable without walking nextCursor. ---- */
async function loadMoreSessions(){
  if (!sessionsNextCursor || sessionsLoadingMore) return;
  sessionsLoadingMore = true;
  try {
    const res = await fetchJson("/api/console/sessions?cursor=" + encodeURIComponent(sessionsNextCursor));
    sessionsList = sessionsList.concat(res.sessions);
    sessionsNextCursor = res.nextCursor ?? null;
    renderSidebar();
  } catch (e) {
    toast("加载更多会话失败: " + (e.kind === "http" && e.body && e.body.error && e.body.error.message ? e.body.error.message : "网络错误"));
  } finally {
    sessionsLoadingMore = false;
  }
}

function renderSidebar(){
  sesBox.innerHTML = "";
  for (const s of sessionsList) {
    const div = document.createElement("div");
    div.className = "srow" + (currentScope && currentScope.kind==="session" && currentScope.id===s.id ? " active" : "");
    div.innerHTML = `<div class="rid">S${s.id}</div><div class="rt">${esc(s.title || "(无标题)")}</div>
      <div class="rm">${s.turnCount} turns · ${esc(s.date)}</div>`;
    div.addEventListener("click", () => loadGraph({ session: s.id }));
    sesBox.appendChild(div);
  }
  if (sessionsNextCursor) {
    const more = document.createElement("div");
    more.className = "srow more";
    more.textContent = "更多…"; // textContent — a static app-authored label, not payload text
    more.addEventListener("click", loadMoreSessions);
    sesBox.appendChild(more);
  }
  segBox.innerHTML = "";
  for (const g of segmentsList) {
    const div = document.createElement("div");
    div.className = "srow" + (currentScope && currentScope.kind==="segment" && currentScope.id===g.id ? " active" : "");
    const dotClass = SEGMENT_STATUS_DOT[g.status] ?? "delivered";
    div.innerHTML = `<div class="rid"><span class="sdot ${dotClass}"></span>E${g.id}</div>
      <div class="rt">${esc(g.title)}</div>
      <div class="rm">${g.memberCount} 成员 · ${esc(g.status)}</div>
      ${g.tags.length?`<div class="tagline">${g.tags.map(t=>"#"+esc(t)).join(" ")}</div>`:""}`;
    div.addEventListener("click", () => loadGraph({ segment: g.id }));
    segBox.appendChild(div);
  }
}

/* ---- filter bar: built once — WORDS is a closed, app-authored set, never graph data ---- */
// [S15069/T1754] The swatch is SOLID for every word. Dashing is no longer a
// property of the relation word — it says whether one EDGE stayed inside a
// lane — so a per-word swatch cannot honestly carry it: the same word draws
// solid on one edge and dashed on the next. The legend states the rule; the
// swatch states only the colour, which IS per-word.
const on = Object.fromEntries(WORDS.map(w=>[w,true]));
for (const w of WORDS) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked data-w="${w}"><span class="sw" style="border-color:var(--${w})"></span>${w}`;
  bar.appendChild(l);
}
bar.insertAdjacentHTML("beforeend", `<span class="sep"></span><input id="search" placeholder="跳转:地址或标题关键词 ⏎">`);
bar.addEventListener("change", e => { if (e.target.dataset.w){ on[e.target.dataset.w]=e.target.checked; paintFilters(); }});

/* ---- graph load: session or segment scope -> /api/console/graph ---- */
async function loadGraph(target){
  const params = new URLSearchParams();
  if (target.session !== undefined) params.set("session", target.session);
  if (target.segment !== undefined) params.set("segment", target.segment);
  if (target.interval !== undefined && target.interval !== null) params.set("interval", target.interval);
  const url = "/api/console/graph?" + params.toString();
  try {
    const data = await fetchJson(url);
    currentScope = target.session !== undefined
      ? { kind: "session", id: target.session }
      : { kind: "segment", id: target.segment };
    currentGraphTarget = target;
    applyGraph(data);
    hideStopped();
    renderSidebar();
  } catch (e) {
    if (e.kind === "http") {
      toast("加载图数据失败: " + (e.body && e.body.error && e.body.error.message ? e.body.error.message : ("HTTP " + e.status)));
    } else {
      showStopped(() => loadGraph(target));
    }
  }
}

function applyGraph(data){
  turns = data.turns; edges = data.edges; lanes = data.lanes;
  idx = new Map(turns.map((t,i)=>[t.id,i]));
  laneByToken = new Map(lanes.map(l=>[l.token,l]));
  turnsByLaneToken = new Map();
  compLaneToken = new Map(); turnsByComp = new Map(); compsByLaneToken = new Map();
  for (const t of turns) {
    for (const m of t.laneMemberships) {
      if (!turnsByLaneToken.has(m.token)) turnsByLaneToken.set(m.token, []);
      turnsByLaneToken.get(m.token).push(t.id);
      // Every component index is READ off the payload's own membership
      // entries, never derived by splitting the id string: `componentId`
      // embeds a `laneToken`, which is itself a JSON pair, so parsing it back
      // apart here would be inventing a second grammar for a fact the payload
      // already states next to it.
      compLaneToken.set(m.componentId, m.token);
      if (!turnsByComp.has(m.componentId)) turnsByComp.set(m.componentId, []);
      turnsByComp.get(m.componentId).push(t.id);
      if (!compsByLaneToken.has(m.token)) compsByLaneToken.set(m.token, new Set());
      compsByLaneToken.get(m.token).add(m.componentId);
    }
  }
  clearFocus();
  renderHeader(data.meta);
  renderRangeBar(data.meta);
  renderLanes();
  renderGraphSvg();
  paintFilters();
  syncBadge();
}

function renderHeader(meta){
  let title = "";
  if (meta.scope.kind === "range") title = `S${meta.scope.sessionId} · T${meta.scope.from}–T${meta.scope.to}`;
  else if (meta.scope.kind === "segment") title = `E${meta.scope.segmentId}`;
  scopeTitleEl.textContent = title; // textContent — no markup ever reaches this sink
  metaEl.textContent = ` ${turns.length} turns · ${edges.length} edges · ${lanes.length} lanes · ${meta.asOf}`;

  if (meta.stateCoverage === "partial") {
    const bounds = meta.appliedBounds.map(b => `${b.bound} ${b.requested}→${b.applied}`).join(", ");
    // Ticket 04 banner semantics update (T1496/T1498 rulings): "partial"
    // means an OLDER interval is not currently shown — never that rows
    // inside the shown interval were silently removed (the old drop-edges-
    // then-turns amputation is retired; the interval selector always ships
    // a COMPLETE sub-graph for whatever interval it picked).
    // Ticket 03 (peer P2-5/P2-6): lanes and laneCheckText are ONE declared
    // semantics — FULL SNAPSHOT, same posture as election tier — never
    // projected down to whichever interval the graph happens to be showing.
    // The old copy claimed lane_check fell short of the full picture, when
    // the payload was already whole-scope; this states the true, single
    // semantics instead.
    const boundsNote = bounds ? `(${bounds})` : "";
    partialBanner.textContent =
      `部分结果 — 更早的区间未显示,可点击下方「较早」查看;当前显示区间内容完整;` +
      `泳道与检验文本覆盖整个范围,图仅显示当前所选区间;` +
      `election tier 按完整快照计算,不受区间选择影响 ${boundsNote}`;
    partialBanner.style.display = "block";
  } else {
    partialBanner.style.display = "none";
  }
}

/* ---- range bar: the interval selector (floor-and-render-fidelity ticket
   04, T1498 ruling) — shows the interval this response actually renders and
   lets the user page to an older one. `meta.interval` is `null` only for a
   zero-turn graph response, in which case the bar stays hidden. ---- */
function renderRangeBar(meta){
  const iv = meta.interval;
  if (!iv) { rangeBar.style.display = "none"; return; }
  rangeBar.style.display = "flex";
  rangeBar.innerHTML = "";
  const label = document.createElement("span");
  label.className = "rangeLabel";
  // textContent — addresses are server-formatted, not raw payload text. The
  // node count rides along because it is the one number the endpoints alone
  // never give: how much of the scope this interval actually holds.
  label.textContent = `区间 ${iv.fromAddress}–${iv.toAddress} · ${turns.length} 个节点`;
  rangeBar.appendChild(label);
  if (!iv.isOldest) {
    const older = document.createElement("button");
    older.type = "button"; older.className = "rangeNav";
    older.textContent = "‹ 较早";
    older.addEventListener("click", () => loadGraph({ ...currentGraphTarget, interval: iv.fromTurnId - 1 }));
    rangeBar.appendChild(older);
  }
  if (!iv.isNewest) {
    const newest = document.createElement("button");
    newest.type = "button"; newest.className = "rangeNav";
    newest.textContent = "最新 ›";
    newest.addEventListener("click", () => {
      const target = { ...currentGraphTarget };
      delete target.interval;
      loadGraph(target);
    });
    rangeBar.appendChild(newest);
  }
}

/* ---- lane strip: ONE group (lane-state-retirement ticket 01) ----
   The strip used to split "open (live work)" from "closed", which is exactly
   the distinction the model dropped: nothing here can know whether a lane will
   continue. One group, the payload's own order, count in the label. */
function renderLanes(){
  laneBox.innerHTML = "";
  laneChips.clear();
  const g = document.createElement("div"); g.className="lgroup";
  g.innerHTML = `<span class="lt">泳道 (${lanes.length})</span>`;
  for (const l of lanes) g.appendChild(laneChip(l));
  laneBox.appendChild(g);
}
function laneChip(l){
  const c = document.createElement("span");
  // ONE styling for every lane. Ticket 04 removed the validity verdict (node
  // death is deleted); ticket 01 removed closure, which was the last per-lane
  // state this class list branched on.
  c.className = "lchip";
  // What the chip says beside the tag is the lane's SIZE — a fact the payload
  // carries whole-snapshot and that stays true however the interval narrows.
  // It replaces the terminus address (`◎S…/T…` / `…◎S…/T…` / `无宣告`), which
  // named a latest-wins seat the model no longer computes; a lane that
  // converged five times never had one.
  const term = `${l.memberCount}`;
  // D5, v11 (lane-declaration ticket 05): a lane's identity is ONE tag now
  // (`ConsoleGraphLane.tag`, never an array) — the prototype's `tagSet.join`
  // is retired along with the exact-set identity it rendered.
  c.innerHTML = `${esc(l.tag)}<span class="term">${term}</span>`;
  c.addEventListener("click", () => {
    // A chip is the WHOLE lane — every component it split into. That is the
    // one place the shattering is visible as a single act: press the chip and
    // the badge says how many islands this lane's members fall into.
    const comps = [...(compsByLaneToken.get(l.token) || [])];
    if (comps.length && sameFocus(comps)) { clearFocus(); }
    else {
      selComps = new Set(comps); solo = null;
      if (sel!==null && !(turnsByLaneToken.get(l.token)||[]).includes(sel)) { sel=null; panel.style.display="none"; }
      const anchor = anchorOf(l.token);
      if (anchor != null && idx.has(anchor))
        wrap.scrollTo({top: yOf(anchor)-innerHeight/2, behavior:"smooth"});
    }
    paintFilters();
    syncBadge();
  });
  laneChips.set(l.token, c);
  return c;
}

/* ---- vertical graph: one row per turn, arcs on the left rails ---- */
const ROW = 22, TOP = 16, NODE_X = 352, TEXT_X = 372, LABEL_GAP = 12;
const yOf = id => TOP + idx.get(id)*ROW + ROW/2;
const W = 1080;
const NS = "http://www.w3.org/2000/svg";
const mk = (n,a) => { const el=document.createElementNS(NS,n); for(const k in a) el.setAttribute(k,a[k]); return el; };

// any blank click (svg background or the baseline) clears all focus. Attached
// once — the listener checks the event target's tag generically, so it stays
// correct across every renderGraphSvg() rebuild of svg's own children.
svg.addEventListener("click", e => {
  if (e.target === svg || e.target.tagName === "line") { clearFocus(); paintFilters(); syncBadge(); }
});

function renderGraphSvg(){
  svg.innerHTML = "";
  edgeEls = []; nodeEls = new Map(); rowEls = new Map();
  const H = TOP*2 + turns.length*ROW;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.appendChild(mk("line",{x1:NODE_X,y1:TOP,x2:NODE_X,y2:H-TOP,stroke:"#eceef0"}));

  // row hover/click layer sits UNDER the edges: the hover band may never mask
  // an arc, and it doubles as a full-width row guide across the rail.
  const bgg = mk("g",{}); svg.appendChild(bgg);
  const eg = mk("g",{}); svg.appendChild(eg);
  let undrawnEdges = 0;
  for (const e of edges) {
    const y1=yOf(e.citingId), y2=yOf(e.citedId);
    // Asserted unreachable — the server only ships an edge whose BOTH endpoints
    // are in the interval it selected. Counted and reported below rather than
    // dropped in silence (T1529 ruling, "不要静默隐藏该有的线"): a line the data
    // says exists must never just fail to appear.
    if (!Number.isFinite(y1)||!Number.isFinite(y2)) { undrawnEdges++; continue; }
    const span = Math.abs(idx.get(e.citingId)-idx.get(e.citedId));
    // Arc depth is REACH. The wide band's old slope (150 + span*1.9) spent 9px
    // across spans 1..6 while 76% of real wide-band edges live at span <= 5, so
    // two citations from one node came out as one stroke (T1527). At span*12
    // the same band separates them by 60px and saturates only past span 15,
    // where the endpoints are already far enough apart to tell the arcs apart.
    const depth = STRUCT.has(e.relation)
      ? Math.min(120, 16 + span*2.4)
      : Math.min(330, 150 + span*12);
    // [S15069/T1760, revised by console-focus-encoding ticket 01, revised
    // again by user ruling 2026-08-28 S15069/T1859] Colour and dash are
    // decided here, at draw time; width never is — it is decided in
    // paintFilters, from whether the edge touches the CLICKED node
    // (`touchesSel`, path.edge.inc), never from this edge's own attribution
    // or from which focused subgraph it may or may not sit inside.
    //   colour — attributed at all (grey = draft), else which relation word
    //   dash   — did the edge stay inside one lane
    // `indexes` still does not render thin for fanning out to the batch it
    // cites — that reading collided with the one channel a reader is
    // actually steering by; `indexes` reads by its own hue (--indexes)
    // instead of a thinner line.
    // A DRAFT is an edge missing a tag on EITHER side, which is v12's own
    // definition, so a half-settled edge greys out with a fully unsettled one.
    // That deliberately drops the distinction between E6 (blocks commit) and
    // the ordinary backlog: the console is a reading surface and the commit
    // refusal names E6 by address, which is where it is actionable.
    //
    // `style`, never `stroke:css(...)`: `css()` resolves through
    // getComputedStyle and BAKES the literal in force when the edge was drawn,
    // so a theme toggle would leave every edge at its old colour. The node
    // dots were fixed for this; the edge strokes were missed.
    const isDraft = e.tailTag === "" || e.headTag === "";
    const p = mk("path",{class:"edge",
      d:`M ${NODE_X} ${y1} Q ${NODE_X-depth} ${(y1+y2)/2} ${NODE_X} ${y2}`,
      style:`stroke:${isDraft?"var(--draft)":`var(--${e.relation})`}`});
    if (!isInternalEdge(e)) p.setAttribute("stroke-dasharray","5 3");
    p.dataset.r=e.relation; p.dataset.s=e.citingId; p.dataset.t=e.citedId;
    // An edge reaches AT MOST two lanes — one per side (ticket 07), which for
    // a cross-lane edge are two genuinely different lanes. `dataset` only
    // holds strings, and `laneToken()` is itself a JSON-stringified pair
    // (`shared/lane-interpretation.ts`), so joining tokens into one dataset
    // string would need an escaping scheme for no benefit: this is a same-
    // document, same-JS-context array, so a plain element property carries
    // it losslessly. `paintFilters` below tests SET MEMBERSHIP (`.some`),
    // never the old single-token string equality.
    p.laneTokens = edgeLaneTokens(e);
    p.componentId = edgeComponentId(e);
    p.addEventListener("mousemove", ev=>tip(ev,
      `${addrOf(e.citingId)} —${esc(e.relation)}→ ${addrOf(e.citedId)}` +
      (edgeSettled(e)?` <span class="lg">${edgeLaneLabel(e)}</span>`:"")));
    p.addEventListener("mouseleave", hideTip);
    eg.appendChild(p); edgeEls.push(p);
  }

  // T1529 ruling: an edge that could not be drawn is REPORTED, never swallowed.
  // The range bar already carries this response's scope line, so the warning
  // lands where the reader is told what they are looking at.
  if (undrawnEdges > 0) {
    const warn = document.createElement("span");
    warn.className = "rangeWarn";
    warn.textContent = `⚠ ${undrawnEdges} 条边的端点不在本次载入的节点集内,未能绘制`;
    rangeBar.appendChild(warn);
    rangeBar.style.display = "flex";
  }

  const ng = mk("g",{}); svg.appendChild(ng);
  const labelEls = [], titleEls = [];
  for (const t of turns) {
    const y = yOf(t.id);
    // hit target covers node + text only — the arc rail stays BLANK, and blank
    // clicks (svg background) clear all focus (T1386 ruling 2).
    const hit = mk("rect",{class:"rowhit",x:NODE_X-10,y:y-ROW/2,width:W-(NODE_X-10),height:ROW});
    hit.addEventListener("click", ()=>select(t.id));
    bgg.appendChild(hit);

    const g = mk("g",{class:"node",transform:`translate(${NODE_X},${y})`});
    const tys = sortTypes(t.type.filter(x=>TYPE_ORDER.includes(x)));
    const r = 5.5;
    // `style`, never the `fill` ATTRIBUTE: a presentation attribute does not
    // accept `var()`, a style property does.
    if (!tys.length) g.appendChild(mk("circle",{r,style:"fill:var(--none)"}));
    else if (tys.length===1) g.appendChild(mk("circle",{r,style:`fill:${typeColor(tys[0])}`}));
    else {
      let a0 = -Math.PI/2;
      for (const ty of tys) {
        const a1 = a0 + 2*Math.PI/tys.length;
        const large = (a1-a0)>Math.PI?1:0;
        g.appendChild(mk("path",{d:`M 0 0 L ${r*Math.cos(a0)} ${r*Math.sin(a0)} A ${r} ${r} 0 ${large} 1 ${r*Math.cos(a1)} ${r*Math.sin(a1)} Z`,style:`fill:${typeColor(ty)}`}));
        a0 = a1;
      }
    }
    // The selection ring, one per node whatever the body shape (circle or
    // pie slices) — hidden until paintFilters adds `sel` ([S15069/T1863]).
    g.appendChild(mk("circle",{class:"selring",r:r+2.5}));
    // NO PER-NODE MARK. `t.laneMemberships` carries one entry PER LANE this
    // turn belongs to, and both marks this block used to draw from it are
    // deleted: the cross over a node dead in every lane (ticket 04 — node
    // death does not exist) and the terminus ring (lane-state-retirement
    // ticket 01 — a lane has no terminus). The payload carries neither flag,
    // so neither glyph has anything to read; an index declaration shows only
    // as an `indexes`-coloured EDGE now (console-focus-encoding ticket 01 —
    // the fan no longer thins itself to stand out; see path.edge above).
    g.addEventListener("click", ()=>select(t.id));
    ng.appendChild(g); nodeEls.set(t.id,g);

    const lb = mk("text",{class:"rowlbl",x:TEXT_X,y:y+3.5});
    lb.textContent = addrOf(t.id);
    // x is set AFTER the loop, from the measured label column — see below.
    const title = mk("text",{class:"rowtitle"+(t.title?"":" none"),y:y+3.5});
    const tt = t.title || "(无笔记)";
    // Code-point slice, never `.slice()` — a UTF-16 code-unit slice cuts
    // mid-surrogate-pair on non-BMP titles (peer finding #14b, matching the
    // server's own codePointExcerpt for the prompt/content excerpt caps).
    // `Array.from` iterates a string by code point.
    const ttCp = Array.from(tt);
    title.textContent = ttCp.length>62 ? ttCp.slice(0,62).join("")+"…" : tt; // textContent — no esc() needed
    ng.appendChild(lb); ng.appendChild(title);
    labelEls.push(lb); titleEls.push(title);
    rowEls.set(t.id,[hit,lb,title]);
  }

  // The label column is MEASURED, never a constant. The retired fixed 52px
  // gutter was sized for the old `T<dbid>` label and painted the title straight
  // through the wider `S<session>/T<prompt>` form the address ruling
  // introduced. Ticket 10 (one address grammar) widens it again: a segment
  // scope used to print a short per-segment ordinal (`E7/T2`) for its own
  // members, narrower than most rows will now ever be — every row can run as
  // wide as its session/prompt digits allow (`S15069/T15829`). Measure once
  // per render — `ng` is already in the document, so getComputedTextLength
  // reports real typeset widths — and fall back to a per-character estimate for
  // an unattached or hidden SVG, where every measurement reads 0.
  let labelW = 0, maxChars = 0;
  for (const lb of labelEls) {
    labelW = Math.max(labelW, lb.getComputedTextLength());
    maxChars = Math.max(maxChars, lb.textContent.length);
  }
  if (!(labelW > 0)) labelW = maxChars * 6.8;
  const titleX = TEXT_X + Math.ceil(labelW) + LABEL_GAP;
  for (const el of titleEls) el.setAttribute("x", titleX);
}

/* ---- interactions ---- */
// Server-computed connectivity ([S15069/T1696]): every membership entry
// already carries its own `componentId` (lane-checker report 2's islands,
// republished), so "the components touching this turn" is a read off the
// payload, never a client-side graph traversal.
function compsTouchingTurn(turnId){
  const t = turns[idx.get(turnId)];
  if (!t || !t.laneMemberships.length) return [];
  return [...new Set(t.laneMemberships.map(m=>m.componentId))];
}
function anchorOf(tok){
  // Where the view scrolls when a lane chip is pressed. It used to prefer the
  // lane's terminus and fall back to its newest loaded member; ticket 01
  // deleted the terminus, so the fallback is the whole rule — which is also
  // the more useful anchor, since it is always inside the rendered set.
  if (!laneByToken.has(tok)) return null;
  const members = turnsByLaneToken.get(tok) || [];
  return members.length ? members[members.length-1] : null;
}
function paintFilters(){
  const anyFocus = selComps.size>0 || solo!==null;
  const litLanes = focusedLaneTokens();
  for (const p of edgeEls){
    p.classList.remove("off","gray","hot","inc");
    if (!on[p.dataset.r]) { p.classList.add("off"); continue; }
    // Width's WHOLE rule, independent of colour/focus below: user ruling
    // 2026-08-28 [S15069/T1859], revising console-focus-encoding ticket 01
    // (cf32918) — that ticket thickened the whole focused SUBGRAPH; this
    // narrows thickness to the clicked node's own neighbourhood. `touchesSel`
    // is true for an edge's in- or out-direction alike (direction does not
    // matter — 出边或入边都算), and is checked with no `anyFocus` gate: with
    // no node clicked (`sel===null`) it is always false, which is how "no
    // focus -> all thin" and "lane-only focus -> width uniformly thin" both
    // fall out of the SAME predicate rather than a separate branch.
    const touchesSel = sel!==null && (p.dataset.s==sel || p.dataset.t==sel);
    if (touchesSel) p.classList.add("inc");
    if (!anyFocus) continue;
    // Only an edge INTERNAL to a focused component lights as structure: it is
    // the edge that made those two turns connected in the first place. A
    // cross-lane edge is in no component and stays gray — it joins nothing —
    // unless the panel's own node is one of its ends (`selDirect` below).
    const inComp = p.componentId !== null && selComps.has(p.componentId);
    const soloDirect = solo!==null && (p.dataset.s==solo || p.dataset.t==solo);
    // 卡片节点(sel)的入边出边一律上色,带不带 tag 都是——T1416 ruling;
    // 权重/虚线语义不变,只解除灰化。
    const selDirect = sel!==null && (p.dataset.s==sel || p.dataset.t==sel);
    if (inComp || soloDirect || selDirect) p.classList.add("hot");
    else p.classList.add("gray");
  }
  // The ring, width's sibling ([S15069/T1861]): mark the ONE node `sel`
  // names. Keyed on `sel` alone — same authority as `touchesSel` above —
  // so clearFocus (sel=null) strips every ring in the same repaint.
  for (const [id, el] of nodeEls) el.classList.toggle("sel", id===sel);
  for (const [tok, el] of laneChips) el.classList.toggle("on", litLanes.has(tok));
  const dimRow = (id, dim) => {
    nodeEls.get(id).classList.toggle("dim", dim);
    for (const el of rowEls.get(id)) el.classList.toggle("dim", dim);
  };
  if (!anyFocus){ for (const t of turns) dimRow(t.id,false); return; }
  const keep = new Set();
  for (const cid of selComps) for (const m of (turnsByComp.get(cid) || [])) keep.add(m);
  if (solo!==null){
    keep.add(solo);
    for (const p of edgeEls) if (on[p.dataset.r]&&(p.dataset.s==solo||p.dataset.t==solo)){ keep.add(+p.dataset.s); keep.add(+p.dataset.t); }
  }
  if (sel!==null) keep.add(sel);
  for (const t of turns) dimRow(t.id, !keep.has(t.id));
}
// Ticket 03 (peer P2-5/P2-6): `sel`/`solo` print through `addrOf`, never the
// bare `T<dbid>` — every id here comes from `select(id)`, always a turn
// already present in the currently-loaded `turns`. The one id that could ever
// fall outside it was a lane's terminus, and lane-state-retirement ticket 01
// removed that field, so the addrOf fallback is now unreachable everywhere.
function syncBadge(){
  if (selComps.size===0 && solo===null && sel===null){ selBadge.style.display="none"; return; }
  // Both numbers, always: they answer different questions and the pair is the
  // point. A node in two lanes reads "2 条 lane · 2 个分量"; one shattered
  // lane's chip reads "1 条 lane · 47 个分量", which is the lane telling you
  // its members are not joined by edges yet.
  const laneCount = focusedLaneTokens().size;
  selBadge.textContent = (selComps.size
    ? `聚焦 ${laneCount} 条泳道 · ${selComps.size} 个分量${sel!==null ? ` · 面板 ${addrOf(sel)}` : ""}`
    : solo!==null ? `聚焦 ${addrOf(solo)}(无泳道,亮直连边)` : `面板 ${addrOf(sel)}`) + " · 空白处/Esc 清除";
  selBadge.style.display = "inline-block";
}
selBadge.onclick = () => { clearFocus(); paintFilters(); syncBadge(); };
addEventListener("keydown", e => { if (e.key==="Escape") selBadge.onclick(); });
// ONE focus system: the component multi-select. Clicking a node SWITCHES
// focus to ITS components — one per lane it belongs to ([S15069/T1696]: "属于
// 两个 lane 的节点就同时点亮两个 lane"), the previous focus clearing. On the
// already-focused set the click is two-stage (T1385): open the panel first;
// undo the focus only when the panel already shows this node. Laneless nodes
// focus solo — their direct edges color.
function select(id){
  const comps = compsTouchingTurn(id);
  if (comps.length){
    if (sameFocus(comps)){
      if (sel === id){ clearFocus(); paintFilters(); syncBadge(); return; }
    } else { selComps = new Set(comps); solo = null; }
  } else {
    if (solo === id && sel === id){ clearFocus(); paintFilters(); syncBadge(); return; }
    selComps = new Set(); solo = id;
  }
  sel = id;
  paintFilters();
  syncBadge();
  renderTurnPanel(id);
}
function renderTurnPanel(id){
  const t = turns[idx.get(id)];
  const outE = edges.filter(e=>e.citingId===id), inE = edges.filter(e=>e.citedId===id);
  const erow = (e,dir) => `<div class="erow" data-j="${dir==="out"?e.citedId:e.citingId}" style="color:${relationVar(e.relation)}">${dir==="out"?`—${esc(e.relation)}→ ${addrOf(e.citedId)}`:`${addrOf(e.citingId)} —${esc(e.relation)}→`}${edgeSettled(e)?` <span class="etags">${edgeLaneLabel(e)}</span>`:""}</div>`;
  // One chip per lane this turn belongs to, and MEMBERSHIP is now all a chip
  // says. Both marks it used to carry are deleted: the dead-in-this-lane flag
  // (ticket 04) and the per-lane terminus ◎ (lane-state-retirement ticket 01).
  const laneChipsHtml = t.laneMemberships.map(({token: tok}) => {
    const l = laneByToken.get(tok);
    // D5, v11 (ticket 05): the panel's per-turn lane chips reflect SET
    // MEMBERSHIP — one chip per lane token this turn belongs to, each
    // labelled by that lane's own single tag, never a joined tagSet.
    return `<span class="chip lane">${esc(l ? l.tag : tok)}</span>`;
  }).join("");
  // The RAW stored tags, every word ([S15069/T1696]). Deliberately NOT the
  // same row as 所属 lane above: that row is what the model resolved, this one
  // is what the turn carries, and the gap between them is the attribution
  // debt. A word that IS one of this turn's lanes keeps the lane styling so
  // the correspondence is readable at a glance; everything else — the
  // segment's own tag, a retired vocabulary word — is muted, present but
  // marked as naming no lane.
  const ownLaneTags = new Set(
    t.laneMemberships.map(({token: tok}) => (laneByToken.get(tok) || {}).tag).filter(Boolean),
  );
  const tagChipsHtml = (t.tags || [])
    .map(tag => `<span class="chip ${ownLaneTags.has(tag) ? "lane" : "tagoff"}">${esc(tag)}</span>`)
    .join("");
  pbody.innerHTML =
    `<div class="addr">${esc(addrOf(t.id))}</div><h2>${esc(t.title||"(无笔记)")}</h2>
     <div class="chips">${sortTypes(t.type).map(x=>`<span class="chip ph" style="background:${typeColor(x)}">${esc(x)}</span>`).join("")}</div>
     ${(t.tags||[]).length?`<div class="flowline">tags:${tagChipsHtml}</div>`:""}
     ${t.laneMemberships.length?`<div class="flowline">所属泳道:${laneChipsHtml}</div>`:""}
     ${t.promptExcerpt?`<div class="sec">prompt</div><div class="prompt">${esc(t.promptExcerpt)}</div>`:""}
     <div class="sec">content</div><div class="content">${esc(t.contentExcerpt||"—")}</div>
     <div class="sec">出边 ${outE.length}</div>${outE.map(e=>erow(e,"out")).join("")||"<div class='flowline'>无</div>"}
     <div class="sec">入边 ${inE.length}</div>${inE.map(e=>erow(e,"in")).join("")||"<div class='flowline'>无</div>"}`;
  panel.style.display="block";
  pbody.querySelectorAll(".erow").forEach(el=>el.addEventListener("click",()=>jump(+el.dataset.j)));
}
function jump(id){
  if (!idx.has(id)) return;
  if (sel!==id) select(id);
  wrap.scrollTo({top: yOf(id)-innerHeight/2, behavior:"smooth"});
}
document.getElementById("close").onclick = ()=>{ sel=null; paintFilters(); syncBadge(); panel.style.display="none"; };
// Jump by ADDRESS, never by internal id (T1482's ruling, which this box was
// the last holdout of): a full `S15069/T1387` matches exactly, a bare
// `T1387`/`1387` matches the trailing `/T<n>` of the address every turn now
// carries, and anything else falls through to a title substring.
document.getElementById("search").addEventListener("keydown", e=>{
  if (e.key!=="Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  const lower = s => s.toLowerCase();
  const exact = turns.find(t=>lower(addrOf(t.id))===lower(q));
  if (exact) return jump(exact.id);
  const m = q.match(/^t?(\d+)$/i);
  if (m) {
    const suffix = "/t"+m[1];
    const byOrdinal = turns.find(t=>lower(addrOf(t.id)).endsWith(suffix));
    if (byOrdinal) return jump(byOrdinal.id);
  }
  const hit = turns.find(t=>(t.title||"").toLowerCase().includes(lower(q)));
  if (hit) jump(hit.id);
});
function tip(ev,html){ tipEl.innerHTML=html; tipEl.style.display="block"; tipEl.style.left=Math.min(ev.clientX+14,innerWidth-440)+"px"; tipEl.style.top=(ev.clientY+16)+"px"; }
function hideTip(){ tipEl.style.display="none"; }

/* ---- recall & timeline panels (console-recall-timeline-panels ticket 13) ----
   Both surfaces are server prose (recallMemory/timelineQuery's own rendered
   text, over /api/console/recall and /api/console/timeline) shown through the
   SAME #panel/#pbody overlay the turn-detail view already uses — a second
   competing panel would be exactly the "speculative chrome" the ticket asks
   this surface to avoid. `.mono` (see the stylesheet) is the one visual
   difference: monospace, matching every address already on screen. */

// Ticket 11's bare-citation grammar, exactly as the ticket names it: a turn
// address (`S<n>/T<m>`), a segment address (`E<n>`), or a segment+lane
// address (`E<n>/#<tag>`) — never a bare `S<n>` (session alone is not a
// citation form). Matched against the ESCAPED string (see `renderMonoText`):
// every character either alternative can match — digits, S/T/E, "/", "#",
// lowercase letters, "-" — passes `esc()` unchanged, so escaping first and
// matching second is safe and never double-escapes a matched address.
const ADDRESS_LINK_RE = /\bS\d+\/T\d+\b|\bE\d+(?:\/#[a-z0-9-]+)?\b/g;
function linkifyAddresses(escaped){
  return escaped.replace(ADDRESS_LINK_RE, addr => `<a href="#" class="addrlink" data-addr="${addr}">${addr}</a>`);
}
function renderMonoText(raw){ return linkifyAddresses(esc(raw)); }

function openTextPanel(title, text){
  // Overwrites #pbody outright — no stale turn-panel content survives under
  // it — but leaves graph focus/dimming exactly as it was: a recall/timeline
  // lookup is not a graph interaction, so it has no business clearing one.
  pbody.innerHTML = `<div class="addr">${esc(title)}</div><div class="content mono">${renderMonoText(text)}</div>`;
  panel.style.display = "block";
}

// A clicked address navigates through the shell's EXISTING mechanisms —
// loadGraph for scope, jump/select for a turn, a lane chip's own click
// handler for a lane — never a parallel navigation path.
async function navigateToAddress(addr){
  const turnMatch = addr.match(/^S(\d+)\/T(\d+)$/);
  if (turnMatch) {
    const sessionId = Number(turnMatch[1]), promptNumber = Number(turnMatch[2]);
    if (!(currentScope && currentScope.kind === "session" && currentScope.id === sessionId)) {
      await loadGraph({ session: sessionId });
    }
    const t = turns.find(t => t.sessionId === sessionId && t.promptNumber === promptNumber);
    if (t) jump(t.id); else toast(`S${sessionId}/T${promptNumber} 不在当前加载区间内`);
    return;
  }
  const laneMatch = addr.match(/^E(\d+)\/#(.+)$/);
  if (laneMatch) {
    const segmentId = Number(laneMatch[1]), tag = laneMatch[2];
    if (!(currentScope && currentScope.kind === "segment" && currentScope.id === segmentId)) {
      await loadGraph({ segment: segmentId });
    }
    const lane = lanes.find(l => l.tag === tag);
    const chip = lane ? laneChips.get(lane.token) : null;
    if (chip) chip.click(); else toast(`E${segmentId} 中未找到泳道 #${tag}`);
    return;
  }
  const segMatch = addr.match(/^E(\d+)$/);
  if (segMatch) { await loadGraph({ segment: Number(segMatch[1]) }); }
}
pbody.addEventListener("click", e => {
  const a = e.target.closest("a.addrlink");
  if (!a) return;
  e.preventDefault();
  navigateToAddress(a.dataset.addr);
});

/* ---- recall search: one box, cross-session — distinct from #search above,
   which only jumps within the CURRENTLY loaded graph. An input that looks
   like an address ("S12", "E7/#foo", "T900", "O4", ...) is sent as `id`;
   anything else is a full-text `query`, same heuristic #search already uses
   for its own address-vs-title split. ---- */
const recallInput = document.getElementById("recallInput");
const looksLikeAddress = q => /^[SETO][\d*]/i.test(q) || /^\d+$/.test(q);
recallInput.addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  const params = new URLSearchParams();
  params.set(looksLikeAddress(q) ? "id" : "query", q);
  try {
    const data = await fetchJson("/api/console/recall?" + params.toString());
    openTextPanel(`recall: ${q}`, data.text);
  } catch (err) {
    toast("recall 失败: " + (err.kind === "http" && err.body && err.body.error && err.body.error.message ? err.body.error.message : "网络错误"));
  }
});

/* ---- timeline: one form (id + view + pageBudget + page) drives every
   lookup (console-timeline-panel-controls ticket 16) — the id input takes
   whatever legal form `timelineQuery` itself accepts (S<n>, S<n>/T-ranges,
   E<n>, E<n>/#<tag>, E<n>/L<n>, ...) and this shell pre-validates NONE of
   it: an illegal input surfaces `timelineQuery`'s own error text verbatim
   (via the console API's typed 400/404 — `err.body.error.message`, same
   shape `#recallInput`'s own error handling already reads), never a second
   client-side grammar. The context-adaptive trigger (`timelineIdForContext`,
   unchanged) is now a PREFILL shortcut into this SAME form — one mechanism
   (`runTimelineQuery`), two entry points, never a divergent fetch path. ---- */
function timelineIdForContext(){
  const litLanes = [...focusedLaneTokens()];
  if (litLanes.length === 1) {
    const lane = laneByToken.get(litLanes[0]);
    // `lane.segment` is `String(segmentId)`, except the DEFAULT_SEGMENT
    // sentinel for a homeless (unsegmented) lane, which has no `E<n>` address
    // at all — `Number(...)` on that sentinel is NaN, so the guard below
    // falls through to the plain session/segment case instead of emitting a
    // bogus "E<NaN>#tag" id.
    const segmentId = Number(lane && lane.segment);
    if (Number.isFinite(segmentId)) return `E${segmentId}/#${lane.tag}`;
  }
  if (!currentScope) return null;
  return currentScope.kind === "segment" ? `E${currentScope.id}` : `S${currentScope.id}`;
}
const timelineIdInput = document.getElementById("timelineIdInput");
const timelineViewSelect = document.getElementById("timelineViewSelect");
const timelinePageBudgetInput = document.getElementById("timelinePageBudget");
const timelinePageInput = document.getElementById("timelinePageInput");

async function runTimelineQuery(){
  const id = timelineIdInput.value.trim();
  if (!id) { toast("请先输入时间线地址"); return; }
  const params = new URLSearchParams();
  params.set("id", id);
  if (timelineViewSelect.value) params.set("view", timelineViewSelect.value);
  if (timelinePageBudgetInput.value.trim()) params.set("pageBudget", timelinePageBudgetInput.value.trim());
  if (timelinePageInput.value.trim()) params.set("page", timelinePageInput.value.trim());
  try {
    const data = await fetchJson("/api/console/timeline?" + params.toString());
    openTextPanel(`timeline: ${id}`, data.text);
  } catch (err) {
    toast("timeline 失败: " + (err.kind === "http" && err.body && err.body.error && err.body.error.message ? err.body.error.message : "网络错误"));
  }
}
for (const el of [timelineIdInput, timelinePageBudgetInput, timelinePageInput]) {
  el.addEventListener("keydown", e => { if (e.key === "Enter") runTimelineQuery(); });
}
// A view change re-runs the CURRENT id — turns/milestones are the only two
// real options (lane is implied by the id's own E<n>/L*/E<n>/#<tag> form,
// never a third dropdown entry for a view that does not exist on its own).
timelineViewSelect.addEventListener("change", () => { if (timelineIdInput.value.trim()) runTimelineQuery(); });
// Page navigation: prev/next step the SAME page field the form already
// exposes and re-run through the one mechanism above — never a separate
// pagination path.
document.getElementById("timelinePrev").addEventListener("click", () => {
  const current = Math.max(1, parseInt(timelinePageInput.value, 10) || 1);
  timelinePageInput.value = String(Math.max(1, current - 1));
  runTimelineQuery();
});
document.getElementById("timelineNext").addEventListener("click", () => {
  const current = Math.max(1, parseInt(timelinePageInput.value, 10) || 1);
  timelinePageInput.value = String(current + 1);
  runTimelineQuery();
});
document.getElementById("timelineBtn").addEventListener("click", () => {
  const id = timelineIdForContext();
  if (!id) { toast("尚无可用的会话/任务上下文"); return; }
  timelineIdInput.value = id;
  timelineViewSelect.value = "";
  timelinePageBudgetInput.value = "";
  timelinePageInput.value = "";
  runTimelineQuery();
});

/* ---- bootstrap ---- */
async function init(){
  await loadSidebar();
  if (sessionsList.length) {
    await loadGraph({ session: sessionsList[0].id });
  } else if (segmentsList.length) {
    await loadGraph({ segment: segmentsList[0].id });
  } else {
    scopeTitleEl.textContent = "无会话";
  }
}
init();
</script>
</body>
</html>
